# Render.com deployment for the TrackShield AI FastAPI backend.
# Frontend stays on Vercel (static) and talks to this service via
# VITE_API_URL + the backend's CORS_ORIGINS allowlist.
#
# This blueprint is zero-config: it presets the production Vercel origin in
# CORS_ORIGINS and generates a strong TRACKSHIELD_SECRET_KEY automatically.
# One-click deploy: https://render.com/deploy?repo=https://github.com/Janvi-kachhiapatel/TrackShield-AI
services:
  - type: web
    name: trackshield-ai-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    # backend/main.py auto-seeds the synthetic dataset on first boot.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEMO_MODE
        value: "true"
      # Signed-token CORS allowlist: production Vercel domain + local dev.
      # Add more origins (comma-separated) if the Vercel domain changes.
      - key: CORS_ORIGINS
        value: "https://track-shield-ai-theta.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      # Render generates a random secret so signed tokens survive restarts.
      - key: TRACKSHIELD_SECRET_KEY
        generateValue: true
